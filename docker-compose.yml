
services:
  # -----------------------------------------
  # BACKEND - FASTAPI
  # -----------------------------------------
  backend:
    build: ./backend

    container_name: smartcampus_backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ./.env

    environment:
      DATABASE_URL: "postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/smartcampus"

    volumes:
      - ./backend:/app

    depends_on:
      db:
        condition: service_healthy

  # -----------------------------------------
  # FRONTEND - NEXT.JS
  # -----------------------------------------
  frontend:
    build: ./frontend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    depends_on:
      - backend

  # -----------------------------------------
  # DATABASE - POSTGRESQL
  # -----------------------------------------
  db:
    image: postgres:16

    container_name: smartcampus

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: smartcampus

      APP_DB_NAME: smartcampus
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -----------------------------------------
  # PGADMIN
  # -----------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: smartcampus_pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      db:
        condition: service_healthy

# -----------------------------------------
# PERSISTENT VOLUMES
# -----------------------------------------
volumes:
  pgdata:
  pgadmin_data:
